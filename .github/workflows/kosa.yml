name: KOSA Archiver

on:
  schedule:
    # 21:37 UTC maps directly to 03:07 AM IST. 
    # An irregular, off-hour time window to avoid global GitHub server traffic congestion.
    - cron: '37 5,21 * * *'
  workflow_dispatch: # Allows you to manually trigger it via the Actions UI anytime

permissions:
  contents: write

jobs:
  archive_and_log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository Base
        uses: actions/checkout@v4

      - name: Initialize Isolated Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Architecture System Modules
        run: |
          python -m pip install --upgrade pip
          pip install internetarchive huggingface_hub

      - name: Execute Core Sync Engine Pipeline
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python main.py

      - name: Commit Status State Changes to Calendar
        run: |
          # Configure commit profile to map directly to your profile metrics
          git config --global user.name "ravikiranoffl"
          git config --global user.email "171322216+ravikiranoffl@users.noreply.github.com"
          
          # Generate the unique dynamic ID string for the commit message matching script
          RUN_ID=$(python -c "from datetime import datetime, timezone, timedelta; print(datetime.now(timezone(timedelta(hours=5, minutes=30))).strftime('%Y%m%dd%H%M%S'))")
          
          git add status.json
          
          # Only commit changes if modifications exist in status.json
          if ! git diff --cached --quiet; then
            git commit -m "$RUN_ID"
            git push "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
            echo "[SYS] Status updates pushed successfully. Calendar contribution updated."
          else
            echo "[SYS] No data mutation found today. Registry matches server baseline."
          fi
